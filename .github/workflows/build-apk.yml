name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add legacy binutils/linker names for cargo-quad-apk
        run: |
          BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          link() { # legacy-triple clang-triple
            for tool in ar ranlib strip; do
              ln -sf "$BIN/llvm-$tool" "$BIN/$1-$tool"
            done
            # rustc calls the linker with cc-style args, so point ld/gcc/clang at the NDK clang wrapper
            for tool in ld gcc clang; do
              ln -sf "$BIN/$2-clang" "$BIN/$1-$tool"
            done
          }
          link arm-linux-androideabi armv7a-linux-androideabi21
          link aarch64-linux-android aarch64-linux-android21
          link x86_64-linux-android x86_64-linux-android21
          link i686-linux-android i686-linux-android21

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked

      - name: Build APK (release)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # cargo-quad-apk picks a linker named *-ld, so rustc assumes raw-ld arguments.
          # Force the gcc/clang-style flavor since the linker is really clang.
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: "-C linker-flavor=gcc"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C linker-flavor=gcc"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C linker-flavor=gcc"
          CARGO_TARGET_I686_LINUX_ANDROID_RUSTFLAGS: "-C linker-flavor=gcc"
        run: cargo quad-apk build --release

      - name: Find APK
        id: find_apk
        run: |
          echo "Searching for APK..."
          find target -name '*.apk' -type f -print
          APK=$(find target -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-control-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
