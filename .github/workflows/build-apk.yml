name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add legacy binutils/linker names for cargo-quad-apk
        run: |
          BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          link() { # legacy-triple clang-triple
            for tool in ar ranlib strip readelf nm objdump objcopy; do
              ln -sf "$BIN/llvm-$tool" "$BIN/$1-$tool"
            done
            for tool in gcc clang; do
              ln -sf "$BIN/$2-clang" "$BIN/$1-$tool"
            done
            # cargo-quad-apk calls "<triple>-ld", so rustc sends raw ld-style
            # arguments. Wrap clang so they are forwarded to the linker (-Wl,)
            # while clang still adds the Android runtime libs itself.
            rm -f "$BIN/$1-ld"
            cat > "$BIN/$1-ld" <<EOF
          #!/bin/bash
          args=()
          for a in "\$@"; do args+=("-Wl,\$a"); done
          exec "$BIN/$2-clang" -shared -fuse-ld=lld "\${args[@]}"
          EOF
            chmod +x "$BIN/$1-ld"
          }
          link arm-linux-androideabi armv7a-linux-androideabi21
          link aarch64-linux-android aarch64-linux-android21
          link x86_64-linux-android x86_64-linux-android21
          link i686-linux-android i686-linux-android21
          echo "--- wrapper check ---"
          cat "$BIN/arm-linux-androideabi-ld"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked

      - name: Set up JDK 8 (cargo-quad-apk needs rt.jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK (release)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo quad-apk build --release

      - name: Find APK
        id: find_apk
        run: |
          echo "Searching for APK..."
          find target -name '*.apk' -type f -print
          APK=$(find target -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-control-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
