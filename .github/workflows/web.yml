name: web-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build WebAssembly
        run: cargo build --release --bin animal_control --target wasm32-unknown-unknown

      - name: Assemble site
        run: |
          mkdir -p site
          cp web/index.html site/
          cp target/wasm32-unknown-unknown/release/animal_control.wasm site/
          # macroquad's JS runtime (provides WebGL, input and audio for the wasm)
          curl -fsSL https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js -o site/mq_js_bundle.js
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
