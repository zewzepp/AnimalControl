[package]
name = "animal-control"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"      # <--- THIS IS THE CRUCIAL FIX

[[bin]]
name = "animal-control"
path = "src/main.rs"

[dependencies]
macroquad = "0.4.14"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.android]
package_name = "rust.animal_control"
label = "Animal Control"
android_version = 30
target_sdk_version = 30
min_sdk_version = 21
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
fullscreen = true
