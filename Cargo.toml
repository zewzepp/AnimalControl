[package]
name = "animal-control"
version = "0.1.0"
edition = "2021"
description = "An omnidirectional FPS arena shooter"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "animal-control"
path = "src/main.rs"

[dependencies]
macroquad = "0.4.14"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
